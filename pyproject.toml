[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kemomctr"
version = "0.5.0"
description = "Fast AI-powered Minecraft Mod localization tool using Gemini 3.0 Flash."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "kemo", email = "90456661+he1se1@users.noreply.github.com"}
]
dependencies = [
    "google-genai>=1.0.0",
    "PyQt6>=6.5.0",
    "mcp>=1.0.0"
]

[project.scripts]
kemomctr = "kemomctr.cli:main"
kemomctr-mcp = "kemomctr.mcp_server:run_mcp_server"